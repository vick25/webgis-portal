{% extends "base.html" %} {% block title %}Manager Dashboard{% endblock %}
<!--  -->
{% block head %}
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>
{% endblock %} {% block content %}
<section class="map-container">
  <h1>Manager Dashboard</h1>
  <p>Welcome to the manager dashboard!</p>
  <div id="map" class="map"></div>

  <aside class="left-panel closed">
    <div class="panel-header">
      <div class="panel-header-left">
        <span class="panel-header-title">Données</span>
      </div>
    </div>
    <div class="panel-scroll">Data</div>
  </aside>

  <button
    type="button"
    class="panel-toggle"
    aria-expanded="false"
    aria-label="Ouvrir le panneau"
  >
    <span>Projets</span
    ><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M9 5l7 7-7 7"></path>
    </svg>
  </button>
</section>
<script>
  var map = L.map("map").setView([-3.47, 23.177], 5);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
</script>
{% endblock %}
