{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    {% block head %}{% endblock %}
    <title>{% block title %}Web GIS{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  </head>
  <body>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="{% url 'manager_index' %}"
            >WWF Projects Portal hub</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <menu role="menu" class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="{% url 'manager_index' %}">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">User</a>
              </li>
            </menu>
          </div>
        </div>
      </nav>
    </header>
    <main class="container-fluid">
      {% block content %}
      <h1>Welcome to WWF GIS</h1>
      {% endblock %}
    </main>
    <footer class="text-center mt-4">
      <p>&copy; 2026 WWF GIS Platform. All rights reserved.</p>
    </footer>
  </body>
</html>
