{% extends "base.html" %} {% load static %} {% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h2 class="text-2xl font-bold mb-4">Login</h2>
  <form method="POST">
    {% csrf_token %}
    <div class="mb-4">
      <label for="username" class="block text-sm font-medium text-slate-700">Username</label>
      <input
        type="text"
        name="username"
        id="username"
        class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500"
      />
    </div>
    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500"
      />
    </div>
    <button
      type="submit"
      class="bg-emerald-500 text-white py-2 px-4 rounded-md hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500"
    >
      Login
    </button>
  </form>
  <div class="mt-4">
    <small>
      Don't have an account? <a href="{% url 'register' %}" class="text-emerald-500 hover:text-emerald-700">Sign Up</a>
    </small>
  </div>
</div>
{% endblock %}
