{% extends "base.html" %} {% load static %}
{% block title %} Register {% endblock%}
{% block content %}
    <div class="max-w-md mx-auto">
        <h2 class="text-2xl font-bold mb-4">Register</h2>
        <form method="post">
            {% csrf_token %}
            {% comment %} <table>
                {{ form.as_table }}
            </table> {% endcomment %}
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-slate-700">Username</label>
                <input required type="text" name="username" id="username" class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500" />
            </div>
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
                <input required type="email" name="email" id="email" class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500" />
            </div>
            <div class="mb-4">
                <label for="password1" class="block text-sm font-medium text-slate-700">Password</label>
                <input required type="password" name="password1" id="password1" class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500" />
            </div>
            <div class="mb-4">
                <label for="password2" class="block text-sm font-medium text-slate-700">Confirm Password</label>
                <input required type="password" name="password2" id="password2" class="mt-1 block w-full border border-slate-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500" />
            </div>
            <button type="submit" class="bg-emerald-500 text-white py-2 px-4 rounded-md hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500">Sign Up</button>
        </form>
        <div class="mt-4">
            <small>
                Already have an account? <a href="{% url 'login' %}" class="text-emerald-500 hover:text-emerald-700">Sign In</a>
            </small>
        </div>
    </div>
{% endblock %}
